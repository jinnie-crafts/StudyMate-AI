<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifying... | StudyMate AI</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .verify-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      box-sizing: border-box;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      background: radial-gradient(circle at top, #0f172a, #020617);
      padding: 24px;
      text-align: center;
      color: white;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.1);
      border-bottom-color: #3b82f6;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .sub-text {
      color: #94a3b8;
      max-width: 320px;
    }
  </style>
</head>
<body class="auth-page verify-page">
  <div class="loader"></div>
  <h1 class="status-text">Checking Verification...</h1>
  <p class="sub-text">Once you click the link in your email, we'll automatically redirect you to your dashboard.</p>
  
  <div style="display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; justify-content: center;">
    <button id="manualCheckBtn" class="primary-btn" style="display: none;">I have verified</button>
    <button id="resendEmailBtn" class="ghost-btn" style="display: none; border: 1px solid rgba(255,255,255,0.2);">Resend Email</button>
    <button id="logoutBtn" class="ghost-btn" style="display: none; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">Logout</button>
  </div>

  <footer class="auth-footer" style="margin-top: 40px; text-align: center;">
    <p class="auth-switch" style="font-size: 13px; opacity: 0.8;">
      <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a>
    </p>
  </footer>
  <!-- IMPORTANT: Redirect back to /login if they land here without being signed in -->
  <script type="module" src="verify.js"></script>
</body>
</html>
